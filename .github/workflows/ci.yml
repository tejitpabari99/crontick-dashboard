name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    name: CI (${{ matrix.os }} / node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify lockfile coverage
        run: npm run verify-lockfile

      - name: Guard against unintended major changeset bumps
        run: npm run check:changesets

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Generated schemas are committed
        run: |
          npm run gen:schemas
          git diff --exit-code schemas/

      - name: Verify tarball contents
        run: npm run verify-tarball

      - name: Verify packed install
        run: npm run verify-package-install

      - name: Audit signatures (advisory, npm >= 10)
        continue-on-error: true
        run: |
          node -e "
            const major = Number(require('child_process').execSync('npm --version').toString().trim().split('.')[0]);
            if (major >= 10) {
              require('child_process').execSync('npm audit signatures', { stdio: 'inherit' });
            } else {
              console.log('npm < 10, skipping signature audit');
            }
          "

  smoke:
    name: Playwright smoke (ubuntu / node 22)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Build
        run: npm run build

      - name: Smoke tests
        run: npm run test:smoke

  verify-package:
    name: Verify package tarball
    runs-on: ubuntu-latest
    needs: ci
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Pack dry-run
        run: npm pack --dry-run

      - name: Verify tarball contents
        run: npm run verify-tarball

      - name: Install tarball and exercise public exports + CLI
        run: npm run verify-package-install
